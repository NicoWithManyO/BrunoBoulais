{% load static tailwind_tags %}<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ seo_title|default:default_seo_title }}</title>
    <meta name="description" content="{{ seo_description|default:default_seo_description }}">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    {# Open Graph #}
    <meta property="og:type" content="{{ seo_og_type|default:'website' }}">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="{{ SITE_NAME }}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{{ seo_title|default:default_seo_title }}">
    <meta property="og:description" content="{{ seo_description|default:default_seo_description }}">
    <meta property="og:image" content="{{ seo_og_image|default:default_seo_og_image }}">

    {# Twitter Card #}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ seo_title|default:default_seo_title }}">
    <meta name="twitter:description" content="{{ seo_description|default:default_seo_description }}">
    <meta name="twitter:image" content="{{ seo_og_image|default:default_seo_og_image }}">

    {% comment %}
    Fonts — Fraunces (display), Spectral (serif body), Inter (sans UI).
    Chargement non-bloquant : media="print" puis swap onload pour
    libérer le rendu critique. Fallback <noscript> pour les rares
    UA sans JS.
    {% endcomment %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% with google_fonts="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,30..100&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" %}
    <link rel="preload" as="style" href="{{ google_fonts }}">
    <link rel="stylesheet" href="{{ google_fonts }}" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="{{ google_fonts }}"></noscript>
    {% endwith %}

    {# Favicons #}
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" sizes="32x32" href="{% static 'favicon-32.png' %}" type="image/png">
    <link rel="icon" sizes="16x16" href="{% static 'favicon-16.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'site.webmanifest' %}">
    <meta name="theme-color" content="#C9622B">

    {% tailwind_css %}

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">

    {% include "partials/ribbon.html" %}

    {% include "partials/header.html" %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{% static 'js/carrousel.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
