{% load static %}<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Console</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="{% static 'favicon-32.png' %}" sizes="32x32" type="image/png">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0f1115; color: #d5d8de;
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        form { width: 100%; max-width: 22rem; padding: 0 1.5rem; }
        h1 { font-size: 1rem; font-weight: 600; letter-spacing: .02em; margin: 0 0 .25rem; }
        p.sub { margin: 0 0 1.75rem; color: #8a919e; font-size: .8125rem; }
        label { display: block; font-size: .75rem; color: #8a919e; margin: 0 0 .35rem; }
        input {
            width: 100%; box-sizing: border-box; padding: .6rem .7rem; margin: 0 0 1rem;
            background: #171a21; color: #e8eaee; border: 1px solid #2a2f3a; border-radius: 6px;
            font: inherit;
        }
        input:focus { outline: none; border-color: #e8b96a; }
        button {
            width: 100%; padding: .6rem; border: 0; border-radius: 6px; cursor: pointer;
            background: #e8b96a; color: #1a1d23; font: inherit; font-weight: 600;
        }
        .error {
            background: #2a1b1b; border: 1px solid #5c2f2f; color: #f0b4b4;
            padding: .6rem .7rem; border-radius: 6px; margin: 0 0 1.25rem; font-size: .8125rem;
        }
    </style>
</head>
<body>
    <form method="post" autocomplete="off">
        {% csrf_token %}
        <h1>Console</h1>
        <p class="sub">Mot de passe du compte et jeton serveur.</p>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>

        <label for="token">Jeton</label>
        <input type="password" id="token" name="token" autocomplete="off" required>

        <button type="submit">Déverrouiller</button>
    </form>
</body>
</html>
