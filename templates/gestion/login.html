{% extends "base.html" %}
{% block title %}Connexion · Gestion{% endblock %}
{% block content %}
<section class="container-prose py-24">
    <p class="eyebrow">Espace privé</p>
    <h1 class="mt-4">Connexion</h1>
    <form method="post" class="mt-10 space-y-5 max-w-md">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Se connecter</button>
    </form>
</section>
{% endblock %}
